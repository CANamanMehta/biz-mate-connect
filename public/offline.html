<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#14284B" />
<title>Offline | AOM CRM</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#14284B;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  .mark{width:72px;height:72px;margin:0 auto 24px;background:#14284B;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px}
  .mark span{display:block;width:32px;height:3px;background:#E8762B;margin-top:6px}
  h1{font-size:22px;margin:0 0 8px}p{color:#5b6475;margin:0 0 24px;max-width:340px}
  button{background:#E8762B;color:#fff;border:0;padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="mark">AOM<span></span></div>
  <h1>You're offline</h1>
  <p>AOM CRM needs a connection to load client data. Check your internet and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
